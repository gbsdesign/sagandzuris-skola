# Builds the Google Play app (android/, a Trusted Web Activity of the site) as an unsigned .aab.
# The upload key is not in the repo (it is public): the bundle is pushed to the branch `android-build`
# and signed outside GitHub. Bump versionCode in android/app/build.gradle for every new upload.
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build the bundle
        working-directory: android
        run: gradle --no-daemon bundleRelease
      - name: Put the bundle on the android-build branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          code=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle)
          mkdir -p /tmp/out && cp "$aab" "/tmp/out/sagandzuri-$code-unsigned.aab"
          cd /tmp/out
          git init -q -b android-build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "Built from ${GITHUB_SHA} (versionCode $code)" > README.md
          git add -A && git commit -qm "Android bundle $code from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" android-build
