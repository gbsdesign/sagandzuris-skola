// The Play Store app = the live site in the app's own window (MainActivity, a WebView — since 2026-11-11; it was a Trusted
// Web Activity in Chrome). The site's own updates reach the app at once; only this wrapper needs a new versionCode.
// Its own parts (src/main/java): home-screen widgets, the icon's menu, church silence, the prayer bell, and since 1.1.2
// the calls' ring (the phone's ringtone, a locked screen) and the chat messages' own channels.
plugins {
    id 'com.android.application'
}

def host = 'sagandzureli.ge'

android {
    namespace 'ge.sagandzureli.app'
    compileSdk 36

    defaultConfig {
        applicationId 'ge.sagandzureli.skola'
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName '1.2.2'

        manifestPlaceholders = [host: host, launchUrl: "https://${host}/"]
        resValue 'string', 'app_name', 'საგანძურის სკოლა'
        resValue 'string', 'launcher_name', 'საგანძური'
        resValue 'string', 'provider_authority', 'ge.sagandzureli.skola.fileprovider'
        // the Firebase project's web client: Google's sign-in gives its ID token for it (SignIn.java)
        // the Firebase project's Android app „Sagandzuri Skola Android“ (ge.sagandzureli.skola, 2026-11-22): Firebase starts by itself from these (what google-services.json gives)
        resValue 'string', 'google_app_id', '1:781443193404:android:933a1cc80e10f903738139'
        resValue 'string', 'google_api_key', 'AIzaSyDmsUc6f0DhKA-dit4PedSWgJb5v6K-yco'
        resValue 'string', 'gcm_defaultSenderId', '781443193404'
        resValue 'string', 'project_id', 'psalms-reading-group-ge-dev'
        resValue 'string', 'google_web_client_id', '781443193404-4avvmqgm9683ioct31gahgd2gdn9eq03.apps.googleusercontent.com'
        resValue 'string', 'asset_statements',
            "[{ \\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": { \\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${host}\\\" } }]"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
