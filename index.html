<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // 1. Mock Vite HMR WebSocket so @vite/client connects cleanly without errors when HMR is disabled in cloud runner
        if (typeof window !== 'undefined' && window.WebSocket) {
          const RealWebSocket = window.WebSocket;
          const MockWebSocket = function(url, protocols) {
            const isViteHmr = protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.includes('vite-hmr'));
            if (!isViteHmr) {
              return protocols !== undefined ? new RealWebSocket(url, protocols) : new RealWebSocket(url);
            }
            const listeners = {};
            const mock = {
              url,
              readyState: 1, // OPEN
              OPEN: 1,
              CONNECTING: 0,
              CLOSING: 2,
              CLOSED: 3,
              send: function() {},
              close: function() {
                mock.readyState = 3;
                emit('close', { type: 'close' });
              },
              addEventListener: function(event, fn) {
                listeners[event] = listeners[event] || [];
                listeners[event].push(fn);
              },
              removeEventListener: function(event, fn) {
                if (!listeners[event]) return;
                listeners[event] = listeners[event].filter(function(cb) { return cb !== fn; });
              },
              dispatchEvent: function(event) {
                emit(event.type, event);
                return true;
              }
            };
            function emit(event, data) {
              if (listeners[event]) {
                listeners[event].slice().forEach(function(fn) {
                  try { fn(data); } catch(e) {}
                });
              }
            }
            setTimeout(function() {
              emit('open', { type: 'open' });
            }, 0);
            return mock;
          };
          MockWebSocket.prototype = RealWebSocket.prototype;
          MockWebSocket.OPEN = RealWebSocket.OPEN;
          MockWebSocket.CONNECTING = RealWebSocket.CONNECTING;
          MockWebSocket.CLOSING = RealWebSocket.CLOSING;
          MockWebSocket.CLOSED = RealWebSocket.CLOSED;
          window.WebSocket = MockWebSocket;
        }

        // 2. Comprehensive console & event filters for Vite logs
        const origError = console.error;
        const origWarn = console.warn;
        console.error = function(...args) {
          const msg = args.map(a => String(a && a.message ? a.message : a || '')).join(' ');
          if (msg.includes('[vite]') || msg.includes('vite-hmr') || msg.includes('WebSocket')) {
            return;
          }
          origError.apply(console, args);
        };
        console.warn = function(...args) {
          const msg = args.map(a => String(a && a.message ? a.message : a || '')).join(' ');
          if (msg.includes('[vite]') || msg.includes('vite-hmr') || msg.includes('WebSocket')) {
            return;
          }
          origWarn.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          const msg = String(e && e.message ? e.message : '');
          const fn = String(e && e.filename ? e.filename : '');
          if (msg.includes('[vite]') || msg.includes('WebSocket') || fn.includes('@vite')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          const msg = String(e && e.reason && e.reason.message ? e.reason.message : e && e.reason ? e.reason : '');
          if (msg.includes('[vite]') || msg.includes('WebSocket')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <!-- viewport-fit=cover: the page reaches under the iPhone notch and home bar; the layout keeps out of them with env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // iPhone / iPad zoom into a text field under 16px when it is tapped and stay zoomed in; maximum-scale stops that there,
      // while pinch-zoom still works (iOS ignores it for pinching). Android would lose pinch-zoom, so it is left alone.
      (function () {
        var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var meta = ios && document.querySelector('meta[name="viewport"]');
        if (meta) meta.setAttribute('content', meta.getAttribute('content') + ', maximum-scale=1');
      })();
    </script>
