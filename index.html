<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // 1. Mock Vite HMR WebSocket so @vite/client connects cleanly without errors when HMR is disabled in cloud runner
        if (typeof window !== 'undefined' && window.WebSocket) {
          const RealWebSocket = window.WebSocket;
          const MockWebSocket = function(url, protocols) {
            const isViteHmr = protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.includes('vite-hmr'));
            if (!isViteHmr) {
              return protocols !== undefined ? new RealWebSocket(url, protocols) : new RealWebSocket(url);
            }
            const listeners = {};
            const mock = {
              url,
              readyState: 1, // OPEN
              OPEN: 1,
              CONNECTING: 0,
              CLOSING: 2,
              CLOSED: 3,
              send: function() {},
              close: function() {
                mock.readyState = 3;
                emit('close', { type: 'close' });
              },
              addEventListener: function(event, fn) {
                listeners[event] = listeners[event] || [];
                listeners[event].push(fn);
              },
              removeEventListener: function(event, fn) {
                if (!listeners[event]) return;
                listeners[event] = listeners[event].filter(function(cb) { return cb !== fn; });
              },
              dispatchEvent: function(event) {
                emit(event.type, event);
                return true;
              }
            };
            function emit(event, data) {
              if (listeners[event]) {
                listeners[event].slice().forEach(function(fn) {
                  try { fn(data); } catch(e) {}
                });
              }
            }
            setTimeout(function() {
              emit('open', { type: 'open' });
            }, 0);
            return mock;
          };
          MockWebSocket.prototype = RealWebSocket.prototype;
          MockWebSocket.OPEN = RealWebSocket.OPEN;
          MockWebSocket.CONNECTING = RealWebSocket.CONNECTING;
          MockWebSocket.CLOSING = RealWebSocket.CLOSING;
          MockWebSocket.CLOSED = RealWebSocket.CLOSED;
          window.WebSocket = MockWebSocket;
        }

        // 2. Comprehensive console & event filters for Vite logs
        const origError = console.error;
        const origWarn = console.warn;
        console.error = function(...args) {
          const msg = args.map(a => String(a && a.message ? a.message : a || '')).join(' ');
          if (msg.includes('[vite]') || msg.includes('vite-hmr') || msg.includes('WebSocket')) {
            return;
          }
          origError.apply(console, args);
        };
        console.warn = function(...args) {
          const msg = args.map(a => String(a && a.message ? a.message : a || '')).join(' ');
          if (msg.includes('[vite]') || msg.includes('vite-hmr') || msg.includes('WebSocket')) {
            return;
          }
          origWarn.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          const msg = String(e && e.message ? e.message : '');
          const fn = String(e && e.filename ? e.filename : '');
          if (msg.includes('[vite]') || msg.includes('WebSocket') || fn.includes('@vite')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          const msg = String(e && e.reason && e.reason.message ? e.reason.message : e && e.reason ? e.reason : '');
          if (msg.includes('[vite]') || msg.includes('WebSocket')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <!-- viewport-fit=cover: the page reaches under the iPhone notch and home bar; the layout keeps out of them with env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // iPhone / iPad zoom into a text field under 16px when it is tapped and stay zoomed in; maximum-scale stops that there,
      // while pinch-zoom still works (iOS ignores it for pinching). Android would lose pinch-zoom, so it is left alone.
      (function () {
        var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var meta = ios && document.querySelector('meta[name="viewport"]');
        if (meta) meta.setAttribute('content', meta.getAttribute('content') + ', maximum-scale=1');
      })();
    </script>
    <title>საგანძურის სკოლა</title>
    <meta name="description" content="ქართული გალობისა და სიმღერის სასწავლო აპლიკაცია" />
    <meta name="theme-color" content="#fcf9f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="საგანძური" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="საგანძურის სკოლა" />
    <meta property="og:description" content="ქართული გალობისა და სიმღერის სასწავლო აპლიკაცია" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@500;600;700;800;900&family=Noto+Serif+Georgian:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // A browser too old for the site (Tailwind v4 needs oklch, color-mix and @property — Chrome 111, Safari 16.4,
      // Firefox 128) shows parts wrong or not at all, and no update of ours can help. Say so plainly with a way to
      // update it (the user's pick, 2026-11-07). Old-style script, so the oldest browsers still run it; ✕ hides it for a week.
      (function () {
        try {
          var css = window.CSS;
          var ok = css && css.supports && css.supports('color', 'oklch(50% 0.1 100)') &&
            css.supports('color', 'color-mix(in srgb, red, blue)') && typeof css.registerProperty === 'function';
          if (ok) return;
          var KEY = 'sg-old-browser';
          try { if (Date.now() - Number(localStorage.getItem(KEY) || 0) < 7 * 864e5) return; } catch (e) { /* storage off */ }
          var ua = navigator.userAgent;
          var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          var android = /Android/.test(ua);
          var play = 'https://play.google.com/store/apps/details?id=';
          var link = '', label = 'ბრაუზერის განახლება', how = '';
          if (ios) how = 'განაახლე ტელეფონი: პარამეტრები → ზოგადი → პროგრამის განახლება.';
          else if (android && /; wv\)/.test(ua)) link = play + 'com.google.android.webview';
          else if (android && /SamsungBrowser/.test(ua)) link = play + 'com.sec.android.app.sbrowser';
          else if (android && /Firefox/.test(ua)) link = play + 'org.mozilla.firefox';
          else if (android) { link = play + 'com.android.chrome'; label = 'Chrome-ის განახლება'; }
          else if (/Firefox/.test(ua)) link = 'https://www.mozilla.org/firefox/new/';
          else link = 'https://www.google.com/chrome/';
          var show = function () {
            var box = document.createElement('div');
            box.setAttribute('role', 'alert');
            box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;bottom:calc(8px + env(safe-area-inset-bottom));' +
              'z-index:2147483000;max-width:520px;margin:0 auto;background:#fbf6ec;color:#2a2017;border:1px solid #e8dcc8;' +
              'border-radius:16px;box-shadow:0 8px 28px rgba(42,32,23,.22);padding:14px 48px 14px 16px;' +
              'font:500 15px/1.45 "Noto Sans Georgian",system-ui,sans-serif;';
            var title = document.createElement('div');
            title.style.cssText = 'font-weight:700;font-size:16px;color:#7a2028;margin-bottom:2px;';
            title.textContent = 'შენი ბრაუზერი ძველია';
            var text = document.createElement('div');
            text.textContent = 'საიტის ზოგი ნაწილი ვერ იმუშავებს. ' + (how || 'განაახლე და ყველაფერი გამოჩნდება.');
            box.appendChild(title);
            box.appendChild(text);
            if (link) {
              var a = document.createElement('a');
              a.href = link;
              a.target = '_blank';
              a.rel = 'noopener';
              a.textContent = label;
              a.style.cssText = 'display:inline-block;margin-top:10px;padding:0 18px;line-height:44px;border-radius:22px;' +
                'background:#7a2028;color:#fff;font-weight:700;text-decoration:none;';
              box.appendChild(a);
            }
            var x = document.createElement('button');
            x.type = 'button';
            x.setAttribute('aria-label', 'დახურვა');
            x.textContent = '✕';
            x.style.cssText = 'position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;border-radius:18px;' +
              'background:transparent;color:#8a7a6a;font-size:18px;cursor:pointer;';
            x.onclick = function () {
              try { localStorage.setItem(KEY, String(Date.now())); } catch (e) { /* storage off */ }
              if (box.parentNode) box.parentNode.removeChild(box);
            };
            box.appendChild(x);
            document.body.appendChild(box);
          };
          if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
        } catch (e) { /* never in the way */ }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
