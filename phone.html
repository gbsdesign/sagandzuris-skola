<!doctype html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ტელეფონის ვერსია</title>
  <!-- Local-only preview: the site inside a phone-sized frame. Not part of the build. -->
  <style>
    body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #2b2420; overflow: hidden; }
    #box { width: 414px; height: 868px; }
    #phone { width: 390px; height: 844px; border: 12px solid #111; border-radius: 40px; background: #fff; transform-origin: 0 0; }
  </style>
</head>
<body>
  <div id="box"><iframe id="phone" src="/"></iframe></div>
  <script>
    // Shrink the phone to fit short windows while keeping its real 390px width
    const phone = document.getElementById('phone');
    const box = document.getElementById('box');
    function fit() {
      const scale = Math.min(1, (window.innerHeight - 20) / 868);
      phone.style.transform = `scale(${scale})`;
      box.style.width = 414 * scale + 'px';
      box.style.height = 868 * scale + 'px';
    }
    window.addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
